<div class="palette-backdrop" *ngIf="open" (click)="close()"><section class="palette" (click)="$event.stopPropagation()" role="dialog" aria-modal="true"><div class="palette-search"><span class="material-symbols-rounded">search</span><input autofocus [(ngModel)]="query" [placeholder]="isFa?'جستجوی سریع در AshkanHR...':'Search AshkanHR…'"/><kbd>ESC</kbd></div><div class="palette-label">{{isFa?'دسترسی سریع':'Quick navigation'}}</div><button *ngFor="let a of results" (click)="choose(a)"><span class="palette-icon material-symbols-rounded">{{a.icon}}</span><span><strong>{{isFa?a.titleFa:a.titleEn}}</strong><small>{{isFa?a.subtitleFa:a.subtitleEn}}</small></span><span class="material-symbols-rounded arrow">arrow_forward</span></button><div class="palette-empty" *ngIf="!results.length">{{isFa?'نتیجه‌ای پیدا نشد':'No results found'}}</div></section></div>
