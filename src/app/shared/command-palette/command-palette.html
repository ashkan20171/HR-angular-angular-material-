<div class="palette-backdrop" *ngIf="open" (click)="close()">
 <section class="palette" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" [attr.aria-label]="isFa ? 'جستجوی صفحات مجاز' : 'Search permitted pages'" (keydown)="onKeydown($event)">
  <div class="palette-search">
   <span class="material-symbols-rounded" aria-hidden="true">search</span>
   <input #searchInput type="search" [(ngModel)]="query" (ngModelChange)="onQueryChange()" [attr.aria-label]="isFa ? 'جستجوی صفحات' : 'Search pages'" [placeholder]="isFa ? 'جستجوی صفحات مجاز...' : 'Search permitted pages…'" aria-controls="command-results" [attr.aria-activedescendant]="results.length ? 'command-result-' + activeIndex : null" />
   <kbd>ESC</kbd>
  </div>
  <div class="palette-label">{{isFa ? 'دسترسی سریع' : 'Quick navigation'}} <small>{{isFa ? '↑ ↓ انتخاب · Enter بازکردن' : '↑ ↓ select · Enter open'}}</small></div>
  <div id="command-results" role="listbox" [attr.aria-label]="isFa ? 'نتایج' : 'Results'">
   <button *ngFor="let a of results; let i = index" type="button" role="option" [id]="'command-result-' + i" [attr.aria-selected]="activeIndex === i" [class.active]="activeIndex === i" (mouseenter)="activeIndex = i" (click)="choose(a)">
    <span class="palette-icon material-symbols-rounded" aria-hidden="true">{{a.icon}}</span>
    <span><strong>{{isFa ? a.titleFa : a.titleEn}}</strong><small>{{isFa ? a.subtitleFa : a.subtitleEn}}</small></span>
    <span class="material-symbols-rounded arrow" aria-hidden="true">arrow_forward</span>
   </button>
  </div>
  <div class="palette-empty" *ngIf="!results.length" role="status">{{isFa ? 'نتیجه‌ای پیدا نشد' : 'No results found'}}</div>
 </section>
</div>
