<section class="hr-page"><header class="hr-page__hero"><div><span class="hr-eyebrow">AshkanHR · Compensation</span><h1>{{fa?'بازنگری جبران خدمات':'Compensation review'}}</h1><p>{{fa?'پیشنهاد افزایش حقوق و چرخه تأیید را مدیریت کنید.':'Manage salary review proposals and approval status.'}}</p></div></header><article class="hr-panel"><div class="hr-panel__body"><div class="hr-form-grid"><label>{{fa?'کارمند':'Employee'}}<input class="hr-search" [(ngModel)]="form.employee"></label><label>{{fa?'حقوق فعلی':'Current salary'}}<input class="hr-search" type="number" [(ngModel)]="form.current"></label><label>{{fa?'حقوق پیشنهادی':'Proposed salary'}}<input class="hr-search" type="number" [(ngModel)]="form.proposed"></label><label>{{fa?'امتیاز عملکرد':'Rating'}}<input class="hr-search" type="number" min="1" max="5" [(ngModel)]="form.rating"></label></div><button class="hr-btn" (click)="add()">{{fa?'افزودن پیشنهاد':'Add proposal'}}</button></div></article><article class="hr-panel"><div class="hr-panel__body hr-list"><div class="role-row" *ngFor="let x of rows"><div><strong>{{x.employee}}</strong><small>{{x.current|number}} → {{x.proposed|number}} · {{x.status}}</small></div><div><button class="hr-btn hr-btn--ghost" (click)="submit(x)">{{fa?'ارسال':'Submit'}}</button> <button class="hr-btn" (click)="approve(x)">{{fa?'تأیید':'Approve'}}</button></div></div></div></article></section>
