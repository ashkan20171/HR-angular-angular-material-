<section class="page"><header><div><h1>{{t('تنظیمات اعلان‌ها','Notification preferences')}}</h1><p>{{t('کانال دریافت اعلان‌های منابع انسانی را برای هر موضوع انتخاب کنید.','Choose how you receive HR notifications for each topic.')}}</p></div><button (click)="save()">{{t('ذخیره تنظیمات','Save preferences')}}</button></header><div class="card"><div class="row head"><b>{{t('موضوع','Topic')}}</b><b>{{t('داخل برنامه','In-app')}}</b><b>{{t('ایمیل','Email')}}</b><b>Push</b></div><div class="row" *ngFor="let x of items"><strong>{{isFa?x.fa:x.en}}</strong><input type="checkbox" [(ngModel)]="x.inApp"><input type="checkbox" [(ngModel)]="x.email"><input type="checkbox" [(ngModel)]="x.push"></div></div><div class="card digest"><label>{{t('خلاصه اعلان‌ها','Notification digest')}}</label><select [(ngModel)]="digest"><option value="instant">{{t('فوری','Instant')}}</option><option value="daily">{{t('روزانه','Daily')}}</option><option value="weekly">{{t('هفتگی','Weekly')}}</option></select></div></section>
