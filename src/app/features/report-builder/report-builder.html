<section class="page-shell"><header class="page-head"><div><h1>{{t('گزارش‌ساز سفارشی','Custom report builder')}}</h1><p>{{t('ساخت گزارش با انتخاب منبع و ستون‌های دلخواه','Build reports by choosing a data source and columns')}}</p></div><button class="primary" (click)="add()">+ {{t('گزارش جدید','New report')}}</button></header><div class="cards"><article class="card" *ngFor="let r of reports"><h3>{{fa?r.nameFa:r.nameEn}}</h3><p>{{r.source}} · {{r.fields.join(', ')}}</p><small>{{r.created | localeDate}}</small><button (click)="remove(r.id)">{{t('حذف','Delete')}}</button></article></div><div class="modal-backdrop" *ngIf="draft"><div class="modal"><h2>{{t('ساخت گزارش','Build report')}}</h2><input [(ngModel)]="draft.nameFa" placeholder="عنوان فارسی"><input [(ngModel)]="draft.nameEn" placeholder="English title"><select [(ngModel)]="draft.source"><option value="employees">Employees</option><option value="attendance">Attendance</option><option value="leave">Leave</option><option value="payroll">Payroll</option></select><div><label *ngFor="let f of ['employee','department','status','contractEnd','manager','amount']"><input type="checkbox" [checked]="draft.fields.includes(f)" (change)="toggle(f)"> {{f}}</label></div><div class="actions"><button (click)="draft=null">{{t('انصراف','Cancel')}}</button><button class="primary" (click)="save()">{{t('ذخیره گزارش','Save report')}}</button></div></div></div></section>
