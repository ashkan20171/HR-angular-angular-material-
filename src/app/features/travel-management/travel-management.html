<section class="hr-page"><header class="hr-page__hero"><div><span class="hr-eyebrow">AshkanHR · Enterprise</span><h1>{{fa?'مدیریت سفر و ماموریت':'Travel management'}}</h1><p>{{fa?'مدیریت یکپارچه و مبتنی بر سطح دسترسی':'Integrated, permission-aware HR operations'}}</p></div></header><article class="hr-panel"><div class="hr-panel__body"><div class="hr-form-grid"><label>{{fa?'کارمند':'Employee'}}<input class="hr-search" [(ngModel)]="form.employee"></label><label>{{fa?'مقصد':'Destination'}}<input class="hr-search" [(ngModel)]="form.destination"></label><label>{{fa?'تاریخ':'Date'}}<input class="hr-search" type="date" [(ngModel)]="form.date"></label><label>{{fa?'هزینه تخمینی':'Estimated cost'}}<input class="hr-search" type="number" [(ngModel)]="form.cost"></label></div><button class="hr-btn" (click)="add()">{{fa?'ثبت سفر':'Create travel request'}}</button><div class="hr-list"><div class="role-row" *ngFor="let x of rows"><div><strong>{{x.employee}} · {{x.destination}}</strong><small>{{x.date|localeDate}} · {{x.cost|number}} · {{x.status}}</small></div><button class="hr-btn" (click)="approve(x)">{{fa?'تایید':'Approve'}}</button></div></div></div></article></section>
