<section class="hr-page"><header class="hr-page__hero"><div><span class="hr-eyebrow">AshkanHR · Enterprise</span><h1>{{fa?'مدیریت دوره آزمایشی':'Probation management'}}</h1><p>{{fa?'مدیریت یکپارچه و مبتنی بر سطح دسترسی':'Integrated, permission-aware HR operations'}}</p></div></header><article class="hr-panel"><div class="hr-panel__body"><div class="hr-form-grid"><label>{{fa?'کارمند':'Employee'}}<input class="hr-search" [(ngModel)]="form.employee"></label><label>{{fa?'شروع':'Start'}}<input class="hr-search" type="date" [(ngModel)]="form.start"></label><label>{{fa?'پایان':'End'}}<input class="hr-search" type="date" [(ngModel)]="form.end"></label></div><button class="hr-btn" (click)="add()">{{fa?'افزودن':'Add'}}</button><div class="hr-list"><div class="role-row" *ngFor="let x of rows"><div><strong>{{x.employee}}</strong><small>{{x.start|localeDate}} → {{x.end|localeDate}} · {{x.score}}% · {{x.status}}</small></div><button class="hr-btn" (click)="complete(x)">{{fa?'تکمیل':'Complete'}}</button></div></div></div></article></section>
