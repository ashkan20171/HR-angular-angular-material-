<section class="page-shell"><header class="page-head"><div><h1>{{t('طراح KPI منابع انسانی','HR KPI designer')}}</h1><p>{{t('تعریف شاخص، هدف، وزن و مالک شاخص','Define metrics, targets, weights and owners')}}</p></div><button class="primary" (click)="add()">+ {{t('KPI جدید','New KPI')}}</button></header><div class="cards"><article class="card" *ngFor="let k of kpis"><h3>{{fa?k.nameFa:k.nameEn}}</h3><p>{{t('هدف','Target')}}: {{k.target}}{{k.unit}} · {{t('وزن','Weight')}}: {{k.weight}}% · {{k.owner}}</p><label><input type="checkbox" [(ngModel)]="k.active"> {{t('فعال','Active')}}</label><button (click)="remove(k.id)">{{t('حذف','Delete')}}</button></article></div><div class="modal-backdrop" *ngIf="draft"><div class="modal"><h2>{{t('تعریف KPI','Define KPI')}}</h2><input [(ngModel)]="draft.nameFa" placeholder="عنوان فارسی"><input [(ngModel)]="draft.nameEn" placeholder="English title"><input type="number" [(ngModel)]="draft.target" [placeholder]="t('هدف','Target')"><input [(ngModel)]="draft.unit" [placeholder]="t('واحد','Unit')"><input [(ngModel)]="draft.owner" [placeholder]="t('مالک شاخص','Owner')"><input type="number" [(ngModel)]="draft.weight" [placeholder]="t('وزن','Weight')"><div class="actions"><button (click)="draft=null">{{t('انصراف','Cancel')}}</button><button class="primary" (click)="save()">{{t('ذخیره','Save')}}</button></div></div></div></section>
