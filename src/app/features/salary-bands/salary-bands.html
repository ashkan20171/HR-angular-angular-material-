<section class="hr-page"><header class="hr-page__hero"><div><span class="hr-eyebrow">AshkanHR · Enterprise</span><h1>{{fa?'باند و گرید حقوقی':'Salary bands & grades'}}</h1><p>{{fa?'مدیریت یکپارچه و مبتنی بر سطح دسترسی':'Integrated, permission-aware HR operations'}}</p></div></header><article class="hr-panel"><div class="hr-panel__body"><div class="hr-form-grid"><label>{{fa?'گرید':'Grade'}}<input class="hr-search" [(ngModel)]="form.grade"></label><label>{{fa?'عنوان':'Title'}}<input class="hr-search" [(ngModel)]="form.title"></label><label>Min<input class="hr-search" type="number" [(ngModel)]="form.min"></label><label>Mid<input class="hr-search" type="number" [(ngModel)]="form.mid"></label><label>Max<input class="hr-search" type="number" [(ngModel)]="form.max"></label></div><button class="hr-btn" (click)="add()">{{fa?'ثبت گرید':'Add grade'}}</button><div class="hr-list"><div class="role-row" *ngFor="let x of rows"><div><strong>{{x.grade}} · {{x.title}}</strong><small>{{x.min|number}} — {{x.mid|number}} — {{x.max|number}}</small></div><button class="hr-btn hr-btn--ghost" (click)="remove(x.id)">{{fa?'حذف':'Delete'}}</button></div></div></div></article></section>
