<section class="hr-page"><header class="hr-page__hero"><div><span class="hr-eyebrow">AshkanHR · Offboarding</span><h1>{{fa?'مصاحبه خروج':'Exit interview builder'}}</h1><p>{{fa?'مصاحبه خروج را برنامه‌ریزی و دلایل خروج و بازخورد را ثبت کنید.':'Schedule exit interviews and capture departure reasons and feedback.'}}</p></div></header><div class="hr-grid"><article class="hr-panel"><div class="hr-panel__body"><div class="hr-form-grid"><label>{{fa?'کارمند':'Employee'}}<input class="hr-search" [(ngModel)]="form.employee"></label><label>{{fa?'تاریخ':'Date'}}<input class="hr-search" type="date" [(ngModel)]="form.date"></label><label>{{fa?'دلیل خروج':'Reason'}}<input class="hr-search" [(ngModel)]="form.reason"></label><label>{{fa?'امتیاز تجربه':'Experience score'}}<input class="hr-search" type="number" min="1" max="5" [(ngModel)]="form.score"></label></div><button class="hr-btn" (click)="add()">{{fa?'زمان‌بندی':'Schedule'}}</button></div></article><article class="hr-panel"><div class="hr-panel__body hr-list"><div class="role-row" *ngFor="let x of rows"><div><strong>{{x.employee}}</strong><small>{{x.date|localeDate}} · {{x.reason}} · {{x.score}}/5</small></div><button class="hr-btn" (click)="toggle(x)">{{x.completed?(fa?'تکمیل شده':'Completed'):(fa?'تکمیل مصاحبه':'Complete')}}</button></div></div></article></div></section>
