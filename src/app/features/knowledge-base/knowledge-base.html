<section class="page-shell"><header class="page-head"><div><h1>{{t('پایگاه دانش منابع انسانی','HR knowledge base')}}</h1><p>{{t('راهنماها، سیاست‌ها و پاسخ پرسش‌های متداول','Guides, policies and frequently asked questions')}}</p></div></header><div class="toolbar"><input [(ngModel)]="q" [placeholder]="t('جست‌وجو در پایگاه دانش','Search knowledge base')"></div><div class="cards"><article class="card" *ngFor="let a of filtered"><span>{{a.category}}</span><h3>{{fa?a.titleFa:a.titleEn}}</h3><small>{{t('به‌روزرسانی','Updated')}}: {{a.updated | localeDate}}</small></article></div></section>
