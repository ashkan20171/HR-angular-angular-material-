<section class="hr-page"><header class="hr-page__hero"><div><span class="hr-eyebrow">AshkanHR · Admin</span><h1>{{fa?'تنظیمات سازمان':'Organization Settings'}}</h1><p>{{fa?'تنظیمات امنیت، بومی‌سازی و سیاست‌های عمومی فضای کاری.':'Workspace localization, security and organization-wide policy settings.'}}</p></div><button class="hr-btn primary" (click)="save()">{{fa?'ذخیره تغییرات':'Save changes'}}</button></header><div class="settings-grid"><article class="hr-panel"><div class="hr-panel__head"><h2>{{fa?'عمومی':'General'}}</h2></div><div class="hr-panel__body form-grid"><label>{{fa?'نام سازمان':'Organization name'}}<input class="hr-search" [(ngModel)]="company"></label><label>{{fa?'منطقه زمانی':'Timezone'}}<select class="hr-search" [(ngModel)]="timezone"><option>Asia/Tehran</option><option>Europe/Amsterdam</option><option>Europe/Berlin</option></select></label><label>{{fa?'شروع هفته':'Week starts'}}<select class="hr-search" [(ngModel)]="week"><option value="saturday">Saturday</option><option value="monday">Monday</option></select></label></div></article><article class="hr-panel"><div class="hr-panel__head"><h2>{{fa?'امنیت':'Security'}}</h2></div><div class="hr-panel__body hr-list"><label class="permission-item"><span><strong>MFA</strong><small>{{fa?'احراز هویت دومرحله‌ای':'Multi-factor authentication'}}</small></span><input type="checkbox" [(ngModel)]="mfa"></label><label class="permission-item"><span><strong>Audit trail</strong><small>{{fa?'ثبت رویدادهای حساس':'Log sensitive events'}}</small></span><input type="checkbox" [(ngModel)]="audit"></label><label>{{fa?'پایان نشست پس از (دقیقه)':'Session timeout (minutes)'}}<input class="hr-search" type="number" [(ngModel)]="session"></label></div></article></div></section>
