<section class="hr-page"><header class="hr-page__hero"><div><span class="hr-eyebrow">AshkanHR · Benefits</span><h1>{{fa?'مدیریت مزایا':'Benefits enrollment'}}</h1><p>{{fa?'طرح‌های بیمه و مزایای کارکنان را تعریف و مدیریت کنید.':'Configure and manage employee benefit plans and enrollment.'}}</p></div></header><div class="hr-grid"><article class="hr-panel"><div class="hr-panel__body"><div class="hr-form-grid"><label>{{fa?'نام مزیت':'Benefit name'}}<input class="hr-search" [(ngModel)]="form.name"></label><label>{{fa?'سهم کارمند %':'Employee %'}}<input class="hr-search" type="number" [(ngModel)]="form.employeeCost"></label><label>{{fa?'سهم کارفرما %':'Employer %'}}<input class="hr-search" type="number" [(ngModel)]="form.employerCost"></label></div><button class="hr-btn" (click)="add()">{{fa?'افزودن طرح':'Add plan'}}</button></div></article><article class="hr-panel"><div class="hr-panel__body hr-list"><div class="role-row" *ngFor="let x of rows"><div><strong>{{x.name}}</strong><small>{{fa?'کارمند':'Employee'}} {{x.employeeCost}}% · {{fa?'کارفرما':'Employer'}} {{x.employerCost}}%</small></div><button class="hr-btn hr-btn--ghost" (click)="toggle(x)">{{x.active?(fa?'فعال':'Active'):(fa?'غیرفعال':'Inactive')}}</button></div></div></article></div></section>
