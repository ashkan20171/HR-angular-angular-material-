<section class="hr-page"><header class="hr-page__hero"><div><span class="hr-eyebrow">AshkanHR · Enterprise</span><h1>{{fa?'گردش ارتقای شغلی':'Promotion workflow'}}</h1><p>{{fa?'مدیریت یکپارچه و مبتنی بر سطح دسترسی':'Integrated, permission-aware HR operations'}}</p></div></header><article class="hr-panel"><div class="hr-panel__body"><div class="hr-form-grid"><label>{{fa?'کارمند':'Employee'}}<input class="hr-search" [(ngModel)]="form.employee"></label><label>{{fa?'سمت فعلی':'Current role'}}<input class="hr-search" [(ngModel)]="form.from"></label><label>{{fa?'سمت پیشنهادی':'Proposed role'}}<input class="hr-search" [(ngModel)]="form.to"></label></div><button class="hr-btn" (click)="add()">{{fa?'ثبت درخواست':'Submit'}}</button><div class="hr-list"><div class="role-row" *ngFor="let x of rows"><div><strong>{{x.employee}}</strong><small>{{x.from}} → {{x.to}} · {{x.status}}</small></div><div><button class="hr-btn" (click)="set(x,'approved')">{{fa?'تایید':'Approve'}}</button> <button class="hr-btn hr-btn--ghost" (click)="set(x,'rejected')">{{fa?'رد':'Reject'}}</button></div></div></div></div></article></section>
