<section class="hr-page"><header class="hr-page__hero"><div><span class="hr-eyebrow">AshkanHR · Enterprise</span><h1>{{fa?'انضباط و شکایات':'Disciplinary & grievance'}}</h1><p>{{fa?'مدیریت یکپارچه و مبتنی بر سطح دسترسی':'Integrated, permission-aware HR operations'}}</p></div></header><article class="hr-panel"><div class="hr-panel__body"><div class="hr-form-grid"><label>{{fa?'کارمند':'Employee'}}<input class="hr-search" [(ngModel)]="form.employee"></label><label>{{fa?'دسته‌بندی':'Category'}}<input class="hr-search" [(ngModel)]="form.category"></label><label>{{fa?'شرح':'Details'}}<input class="hr-search" [(ngModel)]="form.details"></label></div><button class="hr-btn" (click)="add()">{{fa?'ثبت پرونده':'Open case'}}</button><div class="hr-list"><div class="role-row" *ngFor="let x of rows"><div><strong>{{x.employee}} · {{x.category}}</strong><small>{{x.details}} · {{x.status}}</small></div><button class="hr-btn" (click)="close(x)">{{fa?'بستن':'Close'}}</button></div></div></div></article></section>
