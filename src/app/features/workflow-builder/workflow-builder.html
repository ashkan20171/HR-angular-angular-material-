<section class="page"><header><div><h1>{{t('سازنده گردش کار','Workflow builder')}}</h1><p>{{t('مراحل، نقش مسئول و SLA فرآیندهای منابع انسانی را مدیریت کنید.','Manage steps, responsible roles and SLAs for HR processes.')}}</p></div><button (click)="addFlow()">+ {{t('گردش کار جدید','New workflow')}}</button></header>
<div class="grid"><aside><button class="flow" *ngFor="let f of flows;let i=index" [class.active]="i===selected" (click)="selected=i"><b>{{isFa?f.fa:f.en}}</b><span>{{f.steps.length}} {{t('مرحله','steps')}}</span></button></aside>
<main *ngIf="current"><div class="form"><label>{{t('عنوان فارسی','Persian title')}}<input [(ngModel)]="current.fa" (change)="save()"></label><label>{{t('عنوان انگلیسی','English title')}}<input [(ngModel)]="current.en" (change)="save()"></label><label class="toggle"><input type="checkbox" [(ngModel)]="current.enabled" (change)="save()"> {{t('فعال','Enabled')}}</label></div>
<div class="toolbar"><h2>{{t('مراحل تأیید','Approval steps')}}</h2><button (click)="addStep()">+ {{t('افزودن مرحله','Add step')}}</button></div>
<div class="step" *ngFor="let s of current.steps;let i=index"><span class="num">{{i+1}}</span><input [(ngModel)]="s.fa" (change)="save()" [placeholder]="t('عنوان فارسی','Persian title')"><input [(ngModel)]="s.en" (change)="save()" [placeholder]="t('عنوان انگلیسی','English title')"><select [(ngModel)]="s.role" (change)="save()"><option value="supervisor">Supervisor</option><option value="manager">Manager</option><option value="hr-manager">HR Manager</option><option value="accounting">Finance</option><option value="admin">Admin</option></select><label>SLA <input class="sla" type="number" min="1" [(ngModel)]="s.sla" (change)="save()"> h</label><div class="actions"><button (click)="move(i,-1)">↑</button><button (click)="move(i,1)">↓</button><button (click)="removeStep(s.id)">×</button></div></div>
<div class="empty" *ngIf="!current.steps.length">{{t('هنوز مرحله‌ای تعریف نشده است.','No steps have been defined yet.')}}</div></main></div></section>
