<section class="page-shell"><header class="page-head"><div><h1>{{t('مولفه‌های متغیر حقوق','Payroll variable components')}}</h1><p>{{t('مدیریت مزایا، کسورات و فرمول‌های محاسباتی','Manage earnings, deductions and calculation formulas')}}</p></div><button class="primary" (click)="add()">+ {{t('مولفه جدید','New component')}}</button></header><div class="cards"><article class="card" *ngFor="let x of items"><h3>{{fa?x.nameFa:x.nameEn}}</h3><p>{{x.kind}} · <code>{{x.formula}}</code></p><label><input type="checkbox" [(ngModel)]="x.active"> {{t('فعال','Active')}}</label><button (click)="remove(x.id)">{{t('حذف','Delete')}}</button></article></div><div class="modal-backdrop" *ngIf="draft"><div class="modal"><h2>{{t('مولفه حقوق','Payroll component')}}</h2><input [(ngModel)]="draft.nameFa" placeholder="عنوان فارسی"><input [(ngModel)]="draft.nameEn" placeholder="English title"><select [(ngModel)]="draft.kind"><option value="earning">Earning</option><option value="deduction">Deduction</option></select><input [(ngModel)]="draft.formula" placeholder="base*0.10 or fixed:1000000"><label><input type="checkbox" [(ngModel)]="draft.taxable"> {{t('مشمول مالیات','Taxable')}}</label><div class="actions"><button (click)="draft=null">{{t('انصراف','Cancel')}}</button><button class="primary" (click)="save()">{{t('ذخیره','Save')}}</button></div></div></div></section>
