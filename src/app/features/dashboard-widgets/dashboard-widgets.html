<section class="page-shell"><header class="page-head"><div><h1>{{t('سازنده ویجت داشبورد','Dashboard widget builder')}}</h1><p>{{t('چیدمان و شخصی‌سازی داشبورد برای هر نقش','Personalize dashboard layout for each role')}}</p></div><button class="primary" (click)="add()">+ {{t('ویجت جدید','New widget')}}</button></header>
<div class="cards"><article class="card" *ngFor="let w of widgets;let i=index"><h3>{{fa?w.titleFa:w.titleEn}}</h3><p>{{w.type}} · {{w.size}}</p><label><input type="checkbox" [(ngModel)]="w.visible"> {{t('نمایش','Visible')}}</label><div class="actions"><button (click)="move(i,-1)">↑</button><button (click)="move(i,1)">↓</button><button (click)="remove(w.id)">{{t('حذف','Delete')}}</button></div></article></div>
<div class="modal-backdrop" *ngIf="draft"><div class="modal"><h2>{{t('افزودن ویجت','Add widget')}}</h2><input [(ngModel)]="draft.titleFa" placeholder="عنوان فارسی"><input [(ngModel)]="draft.titleEn" placeholder="English title"><select [(ngModel)]="draft.type"><option value="metric">Metric</option><option value="chart">Chart</option><option value="list">List</option></select><select [(ngModel)]="draft.size"><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select><div class="actions"><button (click)="draft=null">{{t('انصراف','Cancel')}}</button><button class="primary" (click)="save()">{{t('ذخیره','Save')}}</button></div></div></div></section>
