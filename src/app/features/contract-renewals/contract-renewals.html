<section class="hr-page"><header class="hr-page__hero"><div><span class="hr-eyebrow">AshkanHR · Contracts</span><h1>{{fa?'مرکز تمدید قرارداد':'Contract renewal center'}}</h1><p>{{fa?'قراردادهای نزدیک به انقضا را قبل از موعد پیگیری و تمدید کنید.':'Track and renew contracts before they expire.'}}</p></div></header><article class="hr-panel"><div class="hr-panel__body hr-list"><div class="role-row" *ngFor="let x of rows"><div><strong>{{x.employee}}</strong><small>{{fa?'پایان قرارداد':'Contract end'}}: {{x.end|localeDate}} · {{label(x.status)}}</small></div><button class="hr-btn" *ngIf="x.status!=='renewed'" (click)="renew(x)">{{fa?'ثبت تمدید':'Mark renewed'}}</button></div></div></article></section>
