<section class="hr-page"><header class="hr-page__hero"><div><span class="hr-eyebrow">AshkanHR · Enterprise</span><h1>{{fa?'درخواست اسناد کارکنان':'Employee document requests'}}</h1><p>{{fa?'مدیریت یکپارچه و مبتنی بر سطح دسترسی':'Integrated, permission-aware HR operations'}}</p></div></header><article class="hr-panel"><div class="hr-panel__body"><div class="hr-form-grid"><label>{{fa?'نوع سند':'Document type'}}<input class="hr-search" [(ngModel)]="form.type"></label><label>{{fa?'دلیل':'Reason'}}<input class="hr-search" [(ngModel)]="form.reason"></label></div><button class="hr-btn" (click)="add()">{{fa?'ثبت درخواست':'Request document'}}</button><div class="hr-list"><div class="role-row" *ngFor="let x of rows"><div><strong>{{x.type}}</strong><small>{{x.reason}} · {{x.status}}</small></div><button class="hr-btn hr-btn--ghost" (click)="cancel(x)">{{fa?'لغو':'Cancel'}}</button></div></div></div></article></section>
